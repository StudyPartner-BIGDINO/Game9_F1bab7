        function initCanvas() {
            const container = document.getElementById('game-container');
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;

            ambientParticles = [];
            for (let i = 0; i < 28; i++) {
                ambientParticles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2.0 + 0.8,
                    alpha: Math.random() * 0.45 + 0.15,
                    speedY: -(Math.random() * 10 + 6),
                    speedX: (Math.random() - 0.5) * 6
                });
            }
        }

        window.addEventListener('resize', () => {
            initCanvas();
            checkQuestionTruncation();
            enforceSafePlayableBoundary();
        });

        function initializeGame() {
            initCanvas();
            score = 0;
            stars = 3;
            currentQuestionIdx = 0;
            updateHUD();
            setupControls();
            setupExpandArrowListener();
            playCinematicOpening();
        }

        /* ==========================================================================
           QUESTION MANAGEMENT & EXPAND ARROW SYSTEM
           ========================================================================== */
        function setupExpandArrowListener() {
            const btnExpand = document.getElementById('btn-toggle-expand');
            const bar = document.getElementById('active-question-bar');

            btnExpand.onclick = (e) => {
                e.stopPropagation();
                bar.classList.toggle('expanded');
                btnExpand.textContent = bar.classList.contains('expanded') ? '▲' : '▼';

                // Recalculate dynamic safe area immediately without pausing gameplay
                enforceSafePlayableBoundary();
            };
        }

        function checkQuestionTruncation() {
            const textEl = document.getElementById('active-question-text');
            const btnEl = document.getElementById('btn-toggle-expand');
            const barEl = document.getElementById('active-question-bar');
            if (!textEl || !btnEl || !barEl) return;

            if (barEl.classList.contains('expanded')) {
                btnEl.style.display = 'inline-flex';
                btnEl.textContent = '▲';
                return;
            }

            // Detect if question text actually overflows 2 lines
            textEl.style.display = '-webkit-box';
            if (textEl.scrollHeight > textEl.clientHeight + 2) {
                btnEl.style.display = 'inline-flex';
                btnEl.textContent = '▼';
            } else {
                btnEl.style.display = 'none';
            }
        }

        function enforceSafePlayableBoundary() {
            const topBoundary = getPlayableTopY();

            // 1. Constrain Snake position if affected by expanded bar
            if (snake.y < topBoundary) {
                snake.y = topBoundary + 5;
                if (snake.targetAngle < 0) snake.targetAngle = Math.PI / 2; // Steer down
            }

            // 2. Reposition items safely if covered by expanded bar
            items.forEach(item => {
                if (item.y < topBoundary + 18) {
                    repositionItem(item);
                }
            });
        }

        function showQuestionCard(index) {
            isMoving = false;
            const q = QUESTIONS_DATA[index];
            
            document.getElementById('modal-q-title').textContent = `第 ${index + 1} 题`;
            document.getElementById('modal-q-text').textContent = q.question;
            
            const listEl = document.getElementById('modal-options-list');
            listEl.innerHTML = '';
            
            q.options.forEach(opt => {
                const optDiv = document.createElement('div');
                optDiv.className = 'option-card-item';
                optDiv.innerHTML = `<div class="opt-badge">${opt.letter}</div><div>${opt.text}</div>`;
                listEl.appendChild(optDiv);
            });

            // Set text on compact header bar
            document.getElementById('active-question-text').textContent = `${index + 1}. ${q.question.replace(/\n+/g, ' ')}`;
            document.getElementById('opt-preview-a').textContent = `A. ${q.options[0].text}`;
            document.getElementById('opt-preview-b').textContent = `B. ${q.options[1].text}`;
            document.getElementById('opt-preview-c').textContent = `C. ${q.options[2].text}`;
            document.getElementById('opt-preview-d').textContent = `D. ${q.options[3].text}`;

            // Reset expansion state for new question
            const bar = document.getElementById('active-question-bar');
            bar.classList.remove('expanded');

            document.getElementById('question-modal').classList.add('active');
            bar.style.display = 'none';
        }

        document.getElementById('btn-start-question').addEventListener('click', () => {
            soundFX.init();
            document.getElementById('question-modal').classList.remove('active');
            const bar = document.getElementById('active-question-bar');
            bar.style.display = 'block';

            // Check if arrow is required for this question
            setTimeout(() => {
                checkQuestionTruncation();
                enforceSafePlayableBoundary();
            }, 50);

            startCountdown();
        });

        function startCountdown() {
            const layer = document.getElementById('countdown-layer');
            const numEl = document.getElementById('countdown-num');
            layer.classList.add('active');

            let count = 3;
            const updateNum = () => {
                if (count > 0) {
                    numEl.textContent = count;
                    numEl.classList.remove('animate');
                    void numEl.offsetWidth;
                    numEl.classList.add('animate');
                    count--;
                    setTimeout(updateNum, 750);
                } else {
                    numEl.textContent = "开始！";
                    numEl.classList.remove('animate');
                    void numEl.offsetWidth;
                    numEl.classList.add('animate');
                    setTimeout(() => {
                        layer.classList.remove('active');
                        resetSnakePosition();
                        spawnObjects();
                        isMoving = true;
                    }, 550);
                }
            };
            updateNum();
        }

        function resetSnakePosition() {
            const topBoundary = getPlayableTopY();
            snake.x = width / 2;
            snake.y = Math.max(topBoundary + 80, height * 0.72);
            snake.angle = -Math.PI / 2;
            snake.targetAngle = -Math.PI / 2;
            snake.history = [];
            
            for (let i = 0; i < snake.targetLength; i += 3) {
                snake.history.push({ x: snake.x, y: snake.y + i });
            }
        }

        /* ==========================================================================
           OBJECT SPAWNING & SAFE POSITIONING (DYNAMIC PlayableTopY RESPECTED)
           ========================================================================== */
        function spawnObjects() {
            items = [];
            const types = ['A', 'B', 'C', 'D', 'APPLE', 'MUSHROOM'];
            const safeMarginX = 50;
            const bottomMargin = 70;
            
            types.forEach(type => {
                let pos = getSafePosition(safeMarginX, bottomMargin);
                items.push({
                    type: type,
                    x: pos.x,
                    y: pos.y,
                    radius: 20,
                    floatOffset: Math.random() * Math.PI * 2
                });
            });
        }

        function getSafePosition(marginX, marginBottom) {
            let pos = { x: 0, y: 0 };
            let valid = false;
            let attempts = 0;

            const dynamicTopY = getPlayableTopY() + 25; // Guarantee safety gap from active question bar

            while (!valid && attempts < 100) {
                attempts++;
                pos.x = marginX + Math.random() * (width - marginX * 2);
                pos.y = dynamicTopY + Math.random() * (height - dynamicTopY - marginBottom);

                if (Math.hypot(pos.x - snake.x, pos.y - snake.y) < 95) continue;

                let tooClose = false;
                for (let item of items) {
                    if (Math.hypot(pos.x - item.x, pos.y - item.y) < 65) {
                        tooClose = true;
                        break;
                    }
                }
                if (!tooClose) valid = true;
            }
            return pos;
        }

        /* ==========================================================================
           CONTROLS (TOUCH SWIPE + WASD / ARROWS)
           ========================================================================== */
        function setupControls() {
            window.addEventListener('touchstart', (e) => {
                if (!isMoving) return;
                soundFX.init();
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (!isMoving || !touchStartX) return;
                const touch = e.touches[0];
                const dx = touch.clientX - touchStartX;
                const dy = touch.clientY - touchStartY;
                
                if (Math.hypot(dx, dy) > 16) {
                    snake.targetAngle = Math.atan2(dy, dx);
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                }
            }, { passive: true });

            const keysPressed = {};
            window.addEventListener('keydown', (e) => {
                soundFX.init();
                keysPressed[e.key] = true;
                handleKeyboardInput();
            });

            window.addEventListener('keyup', (e) => {
                delete keysPressed[e.key];
            });

            function handleKeyboardInput() {
                if (!isMoving) return;
                let dx = 0, dy = 0;
                if (keysPressed['ArrowUp'] || keysPressed['w'] || keysPressed['W']) dy -= 1;
                if (keysPressed['ArrowDown'] || keysPressed['s'] || keysPressed['S']) dy += 1;
                if (keysPressed['ArrowLeft'] || keysPressed['a'] || keysPressed['A']) dx -= 1;
                if (keysPressed['ArrowRight'] || keysPressed['d'] || keysPressed['D']) dx += 1;

                if (dx !== 0 || dy !== 0) {
                    snake.targetAngle = Math.atan2(dy, dx);
                }
            }
        }

        /* ==========================================================================
           GAME LOOP & UPDATE PHYSICS
           ========================================================================== */
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            if (!isPaused) {
                update(dt);
                render();
            }

            requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            ambientParticles.forEach(p => {
                p.y += p.speedY * dt;
                p.x += p.speedX * dt;
                if (p.y < -10) { p.y = height + 10; p.x = Math.random() * width; }
            });

            if (!isMoving) return;

            snake.tongueTimer += dt;

            if (speedBoostTimer > 0) {
                speedBoostTimer -= dt;
                snake.speed = snake.baseSpeed * 1.85;
                const pct = Math.max(0, (speedBoostTimer / 2.0) * 100);
                document.getElementById('powerup-progress').style.width = pct + '%';
                if (speedBoostTimer <= 0) {
                    snake.speed = snake.baseSpeed;
                    document.getElementById('powerup-timer-bar').style.display = 'none';
                }
            }

            let dizzyAngleOffset = 0;
            if (dizzyTimer > 0) {
                dizzyTimer -= dt;
                dizzyAngleOffset = Math.sin(Date.now() * 0.018) * 0.42;
            }

            let diff = (snake.targetAngle + dizzyAngleOffset) - snake.angle;
            diff = Math.atan2(Math.sin(diff), Math.cos(diff));
            snake.angle += diff * Math.min(1, snake.turnSpeed * dt);

            snake.x += Math.cos(snake.angle) * snake.speed * dt;
            snake.y += Math.sin(snake.angle) * snake.speed * dt;

            // DYNAMIC TOP BOUNDARY RESPECTS DYNAMIC QUESTION BAR HEIGHT
            const margin = 20;
            const topMargin = getPlayableTopY();
            let bounced = false;

            if (snake.x < margin) { snake.x = margin; snake.targetAngle = 0; bounced = true; }
            if (snake.x > width - margin) { snake.x = width - margin; snake.targetAngle = Math.PI; bounced = true; }
            if (snake.y < topMargin) { snake.y = topMargin; snake.targetAngle = Math.PI / 2; bounced = true; }
            if (snake.y > height - margin) { snake.y = height - margin; snake.targetAngle = -Math.PI / 2; bounced = true; }

            if (bounced) {
                soundFX.playBounce();
                score = Math.max(0, score - 5);
                updateHUD();
                createParticleBurst(snake.x, snake.y, '#d97706', 8);
            }

            snake.history.unshift({ x: snake.x, y: snake.y });

            let totalDist = 0;
            let pruneIndex = snake.history.length;
            for (let i = 0; i < snake.history.length - 1; i++) {
                const d = Math.hypot(
                    snake.history[i+1].x - snake.history[i].x,
                    snake.history[i+1].y - snake.history[i].y
                );
                totalDist += d;
                if (totalDist >= snake.targetLength) {
                    pruneIndex = i + 1;
                    break;
                }
            }
            if (pruneIndex < snake.history.length) {
                snake.history.length = pruneIndex;
            }

            items.forEach((item) => {
                item.floatOffset += dt * 3;
                const floatY = item.y + Math.sin(item.floatOffset) * 4;
                const dist = Math.hypot(snake.x - item.x, snake.y - floatY);

                if (dist < 18 + item.radius) {
                    handleItemCollision(item);
                }
            });

            particles.forEach((p, index) => {
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.alpha -= dt * 1.8;
                if (p.alpha <= 0) particles.splice(index, 1);
            });
        }

        /* ==========================================================================
           COLLISIONS & GAMEPLAY LOGIC
           ========================================================================== */
        function handleItemCollision(item) {
            const q = QUESTIONS_DATA[currentQuestionIdx];

            if (item.type === 'APPLE') {
                activateApple();
                repositionItem(item);
            } else if (item.type === 'MUSHROOM') {
                activateMushroom();
                repositionItem(item);
            } else {
                handleAnswerChoice(item.type, q.correct);
            }
        }

        function activateApple() {
            soundFX.playSpeed();
            speedBoostTimer = 2.0;
            score += 10;
            updateHUD();
            document.getElementById('powerup-timer-bar').style.display = 'block';
            showToast('速度提升！', 'toast-speed');
            createParticleBurst(snake.x, snake.y, '#ffd700', 16);
        }

        function activateMushroom() {
            soundFX.playDizzy();
            dizzyTimer = 2.5;
            stars = Math.max(0, stars - 1);
            score = Math.max(0, score - 20);
            updateHUD();
            showToast('晕眩！', 'toast-dizzy');
            createParticleBurst(snake.x, snake.y, '#a855f7', 16);
        }

        function handleAnswerChoice(chosenLetter, correctLetter) {
            if (chosenLetter === correctLetter) {
                soundFX.playCorrect();
                isMoving = false;
                score += 100;
                updateHUD();
                showToast('答对了！', 'toast-correct');
                createParticleBurst(snake.x, snake.y, '#10b981', 30);

                setTimeout(() => {
                    currentQuestionIdx++;
                    if (currentQuestionIdx >= QUESTIONS_DATA.length) {
                        completeLevel3();
                    } else {
                        showQuestionCard(currentQuestionIdx);
                    }
                }, 1200);

            } else {
                soundFX.playWrong();
                stars = Math.max(0, stars - 1);
                score = Math.max(0, score - 20);
                updateHUD();
                showToast('答错了！', 'toast-wrong');
                createParticleBurst(snake.x, snake.y, '#ef4444', 20);

                spawnObjects();
            }
        }

        function repositionItem(item) {
            const pos = getSafePosition(50, 70);
            item.x = pos.x;
            item.y = pos.y;
        }

        function showToast(text, typeClass) {
            const toast = document.getElementById('toast-banner');
            toast.textContent = text;
            toast.className = `show ${typeClass}`;
            setTimeout(() => { toast.className = ''; }, 1200);
        }

        function createParticleBurst(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 150 + 40;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: color,
                    radius: Math.random() * 3 + 2,
                    alpha: 1.0
                });
            }
        }

        function updateHUD() {
            document.getElementById('hud-question-count').textContent = `第 ${currentQuestionIdx + 1} / 5 题`;
            document.getElementById('hud-score-display').textContent = score;
            let starStr = '';
            for (let i = 0; i < 3; i++) { starStr += i < stars ? '★' : '☆'; }
            document.getElementById('hud-stars-display').textContent = starStr;
        }

        /* ==========================================================================
           CANVAS RENDERING (DARK BOTANICAL GARDEN ARENA & NATURAL SERPENT)
           ========================================================================== */
        function render() {
            ctx.clearRect(0, 0, width, height);

            // 1. Draw Ground Texture & Shadows
            drawEdenGardenBackground();

            // 2. Draw Subtle Eden Ambient Light Dust
            ambientParticles.forEach(p => {
                ctx.save();
                ctx.fillStyle = '#fef08a';
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // 3. Draw Collectibles (A, B, C, D, Apple, Mushroom)
            items.forEach(item => { drawCollectible(item); });

            // 4. Draw Natural Emerald/Forest Serpent Snake
            drawSemiRealisticSnake();

            // 5. Draw Particle FX
            particles.forEach(p => {
                ctx.save();
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        /* ==========================================================================
           CANVAS GROUND BACKDROP
           ========================================================================== */
        function drawEdenGardenBackground() {
            ctx.save();

            // Base Layer: Dark Forest-Green Soil Radial Gradient
            const bgGrad = ctx.createRadialGradient(width * 0.5, height * 0.4, 30, width * 0.5, height * 0.5, height * 0.85);
            bgGrad.addColorStop(0, '#0d2818');  
            bgGrad.addColorStop(0.5, '#061a10'); 
            bgGrad.addColorStop(1, '#020804');   
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // Organic Soil Patches
            ctx.fillStyle = '#082414';
            ctx.globalAlpha = 0.45;
            ctx.beginPath();
            ctx.ellipse(width * 0.3, height * 0.35, 140, 80, 0.2, 0, Math.PI * 2);
            ctx.ellipse(width * 0.7, height * 0.65, 160, 90, -0.3, 0, Math.PI * 2);
            ctx.fill();

            // Restrained Top Sunlight Shaft
            const rayGrad = ctx.createLinearGradient(width * 0.5, 0, width * 0.5, height * 0.55);
            rayGrad.addColorStop(0, 'rgba(234, 179, 8, 0.08)');
            rayGrad.addColorStop(1, 'rgba(234, 179, 8, 0)');
            ctx.fillStyle = rayGrad;
            ctx.beginPath();
            ctx.moveTo(width * 0.25, 0);
            ctx.lineTo(width * 0.75, 0);
            ctx.lineTo(width * 0.9, height * 0.55);
            ctx.lineTo(width * 0.1, height * 0.55);
            ctx.closePath();
            ctx.fill();

            // Arena Border Accent
            ctx.globalAlpha = 1.0;
            ctx.strokeStyle = 'rgba(212, 175, 55, 0.22)';
            ctx.lineWidth = 2.5;
            ctx.strokeRect(10, 10, width - 20, height - 20);

            ctx.restore();
        }

        /* ==========================================================================
           RESTRAINED NATURAL FANTASY SERPENT RENDERING
           ========================================================================== */
        function drawSemiRealisticSnake() {
            if (snake.history.length < 3) return;

            ctx.save();

            const points = snake.history;
            const distances = [0];
            let accumulated = 0;
            for (let i = 0; i < points.length - 1; i++) {
                const d = Math.hypot(points[i+1].x - points[i].x, points[i+1].y - points[i].y);
                accumulated += d;
                distances.push(accumulated);
            }

            function getSnakeBodyWidth(dist) {
                if (dist < 12) return 14;
                if (dist < 40) return 18;
                if (dist < 100) return 14;
                if (dist < 135) return 8;
                return Math.max(2, 8 * (1 - (dist - 135) / 20));
            }

            // 1. Soft Dynamic Ground Shadow
            ctx.beginPath();
            for (let i = 0; i < points.length; i++) {
                const pt = points[i];
                if (i === 0) ctx.moveTo(pt.x + 6, pt.y + 10);
                else ctx.lineTo(pt.x + 6, pt.y + 10);
            }
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.lineWidth = 16;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            // 2. Snake Body Path
            for (let i = points.length - 1; i >= 1; i--) {
                const pt = points[i];
                const prevPt = points[i - 1];
                const dist = distances[i];
                const w = getSnakeBodyWidth(dist);

                const wave = Math.sin(dist * 0.08 - Date.now() * 0.006) * 2.2;
                const angle = Math.atan2(prevPt.y - pt.y, prevPt.x - pt.x);
                const perpX = -Math.sin(angle) * wave;
                const perpY = Math.cos(angle) * wave;

                ctx.beginPath();
                ctx.arc(pt.x + perpX, pt.y + perpY, w / 2, 0, Math.PI * 2);

                const bodyGrad = ctx.createRadialGradient(
                    pt.x + perpX - w*0.2, pt.y + perpY - w*0.2, 1,
                    pt.x + perpX, pt.y + perpY, w / 2
                );
                bodyGrad.addColorStop(0, '#3f6212');   
                bodyGrad.addColorStop(0.4, '#15803d'); 
                bodyGrad.addColorStop(1, '#052e16');   

                ctx.fillStyle = bodyGrad;
                ctx.fill();

                if (i % 6 === 0 && dist > 15 && dist < 120) {
                    ctx.fillStyle = 'rgba(234, 179, 8, 0.35)';
                    ctx.beginPath();
                    ctx.arc(pt.x + perpX, pt.y + perpY, w * 0.2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 3. Snake Head
            const headPt = points[0];
            ctx.save();
            ctx.translate(headPt.x, headPt.y);
            ctx.rotate(snake.angle);

            ctx.beginPath();
            ctx.moveTo(16, 0);
            ctx.quadraticCurveTo(8, -12, -8, -10);
            ctx.quadraticCurveTo(-14, 0, -8, 10);
            ctx.quadraticCurveTo(8, 12, 16, 0);
            ctx.closePath();

            const headGrad = ctx.createRadialGradient(2, -2, 2, 0, 0, 16);
            headGrad.addColorStop(0, '#22c55e');
            headGrad.addColorStop(0.5, '#15803d');
            headGrad.addColorStop(1, '#064e3b');
            ctx.fillStyle = headGrad;
            ctx.fill();
            ctx.strokeStyle = '#b8860b'; 
            ctx.lineWidth = 1;
            ctx.stroke();

            // Dark Eyes
            ctx.fillStyle = '#0a0f1d';
            ctx.beginPath();
            ctx.arc(6, -6, 2.5, 0, Math.PI * 2);
            ctx.arc(6, 6, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(7, -6.5, 0.8, 0, Math.PI * 2);
            ctx.arc(7, 5.5, 0.8, 0, Math.PI * 2);
            ctx.fill();

            // Tongue Flick
            if (Math.sin(snake.tongueTimer * 8) > 0.6) {
                ctx.strokeStyle = '#dc2626';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(16, 0);
                ctx.lineTo(24, 0);
                ctx.lineTo(28, -3);
                ctx.moveTo(24, 0);
                ctx.lineTo(28, 3);
                ctx.stroke();
            }

            ctx.restore();
            ctx.restore();
        }

        /* ==========================================================================
           COLLECTIBLE OBJECTS RENDERING
           ========================================================================== */
        function drawCollectible(item) {
            const floatY = item.y + Math.sin(item.floatOffset) * 4;

            ctx.save();

            ctx.beginPath();
            ctx.ellipse(item.x, item.y + 18, 15, 5, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.fill();

            if (item.type === 'APPLE') {
                const grad = ctx.createRadialGradient(item.x - 4, floatY - 4, 2, item.x, floatY, 18);
                grad.addColorStop(0, '#fca5a5');
                grad.addColorStop(0.35, '#dc2626');
                grad.addColorStop(1, '#450a0a');

                ctx.beginPath();
                ctx.arc(item.x, floatY, 16, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.shadowColor = 'rgba(220, 38, 38, 0.5)';
                ctx.shadowBlur = 10;
                ctx.fill();

                ctx.beginPath();
                ctx.ellipse(item.x + 4, floatY - 16, 6, 3, Math.PI / 4, 0, Math.PI * 2);
                ctx.fillStyle = '#15803d';
                ctx.fill();

            } else if (item.type === 'MUSHROOM') {
                const capGrad = ctx.createRadialGradient(item.x, floatY - 4, 2, item.x, floatY, 16);
                capGrad.addColorStop(0, '#d8b4fe');
                capGrad.addColorStop(0.5, '#7e22ce');
                capGrad.addColorStop(1, '#3b0764');

                ctx.beginPath();
                ctx.arc(item.x, floatY, 16, Math.PI, 0);
                ctx.fillStyle = capGrad;
                ctx.shadowColor = 'rgba(126, 34, 206, 0.5)';
                ctx.shadowBlur = 10;
                ctx.fill();

                ctx.fillStyle = '#f3e8ff';
                ctx.fillRect(item.x - 4, floatY, 8, 12);

            } else {
                let colorStops = ['#fb7185', '#be123c', '#4c0519'];
                let glowColor = 'rgba(190, 18, 60, 0.5)';

                if (item.type === 'B') { colorStops = ['#fcd34d', '#d97706', '#78350f']; glowColor = 'rgba(217, 119, 6, 0.5)'; }
                if (item.type === 'C') { colorStops = ['#60a5fa', '#1d4ed8', '#1e3a8a']; glowColor = 'rgba(29, 78, 216, 0.5)'; }
                if (item.type === 'D') { colorStops = ['#c084fc', '#7e22ce', '#3b0764']; glowColor = 'rgba(126, 34, 206, 0.5)'; }

                const orbGrad = ctx.createRadialGradient(item.x - 5, floatY - 5, 2, item.x, floatY, 20);
                orbGrad.addColorStop(0, colorStops[0]);
                orbGrad.addColorStop(0.5, colorStops[1]);
                orbGrad.addColorStop(1, colorStops[2]);

                ctx.beginPath();
                ctx.arc(item.x, floatY, 18, 0, Math.PI * 2);
                ctx.fillStyle = orbGrad;
                ctx.strokeStyle = '#d4af37'; 
                ctx.lineWidth = 2;
                ctx.shadowColor = glowColor;
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = '900 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 4;
                ctx.fillText(item.type, item.x, floatY + 1);
            }

            ctx.restore();
        }

        /* ==========================================================================
           MODAL MENUS & NAVIGATION (PAUSE / VICTORY / MAP PROGRESSION)
           ========================================================================== */
        document.getElementById('btn-pause').addEventListener('click', () => {
            isPaused = true;
            document.getElementById('pause-modal').classList.add('active');
        });

        document.getElementById('btn-resume').addEventListener('click', () => {
            isPaused = false;
            document.getElementById('pause-modal').classList.remove('active');
        });

        document.getElementById('btn-restart').addEventListener('click', () => {
            document.getElementById('pause-modal').classList.remove('active');
            restartLevel3();
        });

        document.getElementById('btn-quit').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        document.getElementById('btn-victory-map').addEventListener('click', () => {
            saveLevel3Progression();
            window.location.href = 'index.html';
        });

        /* ==========================================================================
           ROBUST LEVEL 3 COMPLETION & LEVEL 4 UNLOCK PROGRESSION SYSTEM
           ========================================================================== */
        function saveLevel3Progression() {
            const STORAGE_KEY = 'game_level_progression_v1';
            try {
                let progress = null;
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        progress = JSON.parse(saved);
                    } catch (e) {
                        console.error("Error parsing game_level_progression_v1", e);
                    }
                }

                if (!progress || typeof progress !== 'object') {
                    progress = {
                        levels: {
                            1: { unlocked: true, completed: false, stars: 0, score: 0 }
                        },
                        achievements: [],
                        stats: {
                            totalScore: 0,
                            levelsCompleted: 0
                        }
                    };
                }

                if (!progress.levels) {
                    progress.levels = {};
                }

                // Level 3 details (unlocked and completed)
                if (!progress.levels[3]) {
                    progress.levels[3] = {};
                }
                progress.levels[3].unlocked = true;
                progress.levels[3].completed = true;
                progress.levels[3].score = score;
                progress.levels[3].stars = stars;

                // Level 4 details (unlocked, not completed)
                if (!progress.levels[4]) {
                    progress.levels[4] = {};
                }
                progress.levels[4].unlocked = true;
                if (progress.levels[4].completed === undefined) {
                    progress.levels[4].completed = false;
                }

                // Recalculate stats dynamically matching index.html logic
                if (!progress.stats) {
                    progress.stats = { totalScore: 0, levelsCompleted: 0 };
                }

                let totalScore = 0;
                let completedCount = 0;
                Object.keys(progress.levels).forEach(k => {
                    const lvl = progress.levels[k];
                    if (lvl && lvl.completed) completedCount++;
                    if (lvl && lvl.score) totalScore += lvl.score;
                });
                progress.stats.totalScore = totalScore;
                progress.stats.levelsCompleted = completedCount;

                localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));

                // Backward compatibility keys
                localStorage.setItem('level3_completed', 'true');
                localStorage.setItem('level_3_complete', 'true');
                localStorage.setItem('level3_complete', 'true');
                localStorage.setItem('level3Completed', 'true');

                let currentUnlocked = parseInt(localStorage.getItem('unlockedLevel') || '0', 10);
                if (isNaN(currentUnlocked) || currentUnlocked < 4) {
                    localStorage.setItem('unlockedLevel', '4');
                }

                let maxLevel = parseInt(localStorage.getItem('maxLevel') || '0', 10);
                if (isNaN(maxLevel) || maxLevel < 4) {
                    localStorage.setItem('maxLevel', '4');
                }

                let userLevel = parseInt(localStorage.getItem('userLevel') || '0', 10);
                if (isNaN(userLevel) || userLevel < 4) {
                    localStorage.setItem('userLevel', '4');
                }

                ['gameProgress', 'game_progress', 'educational_game_progress'].forEach(key => {
                    try {
                        let prog = JSON.parse(localStorage.getItem(key) || '{}');
                        if (typeof prog === 'object') {
                            prog.level3 = { completed: true, score: score, stars: stars };
                            prog.level3_completed = true;
                            if (!prog.unlockedLevel || prog.unlockedLevel < 4) {
                                prog.unlockedLevel = 4;
                            }
                            localStorage.setItem(key, JSON.stringify(prog));
                        }
                    } catch(e) {}
                });

            } catch (e) {
                console.warn("localStorage progression save error:", e);
            }
        }

        function completeLevel3() {
            isMoving = false;
            
            saveLevel3Progression();

            document.getElementById('active-question-bar').style.display = 'none';
            document.getElementById('victory-score').textContent = score;

            let starStr = '';
            for (let i = 0; i < 3; i++) { starStr += i < stars ? '★' : '☆'; }
            document.getElementById('victory-stars').textContent = starStr;

            setTimeout(() => {
                document.getElementById('victory-modal').classList.add('active');
            }, 600);
        }

        function restartLevel3() {
            isPaused = false;
            isMoving = false;
            document.getElementById('victory-modal').classList.remove('active');
            document.getElementById('pause-modal').classList.remove('active');
            initializeGame();
        }

        window.addEventListener('load', () => {
            initializeGame();
            requestAnimationFrame(gameLoop);
        });
    </script>
</body>
</html>
